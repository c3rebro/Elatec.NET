name: Publish NuGet Package
# Release retries are idempotent: existing tags/releases/packages are reused or skipped.

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      statuses: write
      id-token: write  # required for OIDC trusted publishing to NuGet.org

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          version=$(grep -oPm1 '(?<=<AssemblyVersion>)[^<]+' Elatec.NET.csproj)
          if [ -z "$version" ]; then
            echo "Could not determine AssemblyVersion from Elatec.NET.csproj" >&2
            exit 1
          fi

          expected_tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "$tag" != "$expected_tag" ]; then
              echo "Tag $tag does not match project version $expected_tag" >&2
              exit 1
            fi
          else
            tag="$expected_tag"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        id: setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        id: restore
        run: dotnet restore Elatec.NET.sln

      - name: Test
        id: test
        run: dotnet test Elatec.NET.sln --no-restore

      - name: Build release targets
        id: release-build
        run: dotnet build Elatec.NET.csproj --configuration Release --no-restore /p:GeneratePackageOnBuild=false

      - name: Pack
        id: pack
        shell: bash
        run: |
          set +e
          dotnet pack Elatec.NET.csproj --configuration Release --no-build --output ./nupkg /p:GeneratePackageOnBuild=false 2>&1 | tee pack.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            error_code=$(grep -Eo '(CS|NU|MSB)[0-9]{4}' pack.log | head -n1 || true)
            error_line=$(grep -Em1 '(^|: )(error|Error)|error [A-Z]+' pack.log || tail -n1 pack.log || true)
            error_slug=$(printf '%s' "$error_line" | tr -cs 'A-Za-z0-9._-' '-' | cut -c1-65)
            echo "error_code=${error_code:-unknown}" >> "$GITHUB_OUTPUT"
            echo "error_slug=${error_slug:-unknown}" >> "$GITHUB_OUTPUT"
          else
            echo "error_code=none" >> "$GITHUB_OUTPUT"
            echo "error_slug=none" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Create release tag
        id: tag
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null || true)

          if [ -n "$existing" ]; then
            echo "Tag $tag already exists at $existing; leaving it unchanged."
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="$GITHUB_SHA"
          fi

      - name: Create GitHub release
        id: github-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" --title "Elatec.NET $tag" --generate-notes
          fi

      - name: Upload package to GitHub release
        id: release-asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ steps.release.outputs.tag }}" ./nupkg/*.nupkg --clobber

      - name: NuGet login (OIDC to temporary API key)
        id: nuget-auth
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: c3rebro

      - name: Push to NuGet.org
        id: nuget-push
        continue-on-error: true
        env:
          OIDC_NUGET_API_KEY: ${{ steps.nuget-auth.outputs.NUGET_API_KEY }}
          FALLBACK_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          if [ -n "$OIDC_NUGET_API_KEY" ]; then
            api_key="$OIDC_NUGET_API_KEY"
            echo "auth_source=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$FALLBACK_NUGET_API_KEY" ]; then
            api_key="$FALLBACK_NUGET_API_KEY"
            echo "auth_source=repository-secret" >> "$GITHUB_OUTPUT"
          else
            echo "Neither Trusted Publishing nor NUGET_API_KEY is available." >&2
            echo "auth_source=none" >> "$GITHUB_OUTPUT"
            echo "error_slug=no-credential" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          set +e
          dotnet nuget push ./nupkg/*.nupkg --api-key "$api_key" --source https://api.nuget.org/v3/index.json --skip-duplicate 2>&1 | tee nuget-push.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            http_code=$(grep -Eo '(^|[^0-9])(401|403|409)([^0-9]|$)' nuget-push.log | grep -Eo '(401|403|409)' | head -n1 || true)
            error_line=$(grep -Em1 'error|Error|Response status code' nuget-push.log || tail -n1 nuget-push.log || true)
            error_slug=$(printf '%s' "$error_line" | tr -cs 'A-Za-z0-9._-' '-' | cut -c1-65)
            echo "error_slug=${http_code:-no-http}-${error_slug:-unknown}" >> "$GITHUB_OUTPUT"
          else
            echo "error_slug=none" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Push to GitHub Packages
        id: github-packages
        continue-on-error: true
        if: always() && steps.pack.outcome == 'success'
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/c3rebro/index.json --skip-duplicate

      - name: Record release status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          post_status() {
            step="$1"
            outcome="$2"
            if [ "$outcome" = "success" ]; then
              state="success"
            else
              state="failure"
            fi
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$state" \
              -f context="release/${step}/${outcome}" \
              -f description="${step} outcome: ${outcome}"
          }

          post_status "checkout" "${{ steps.checkout.outcome }}"
          post_status "resolve" "${{ steps.release.outcome }}"
          post_status "setup" "${{ steps.setup.outcome }}"
          post_status "restore" "${{ steps.restore.outcome }}"
          post_status "test" "${{ steps.test.outcome }}"
          post_status "release-build" "${{ steps.release-build.outcome }}"
          post_status "pack" "${{ steps.pack.outcome }}"
          if [ "${{ steps.pack.outcome }}" != "success" ]; then
            post_status "pack-error-${{ steps.pack.outputs.error_code }}-${{ steps.pack.outputs.error_slug }}" "failure"
          fi
          post_status "tag" "${{ steps.tag.outcome }}"
          post_status "github-release" "${{ steps.github-release.outcome }}"
          post_status "release-asset" "${{ steps.release-asset.outcome }}"
          post_status "nuget-auth" "${{ steps.nuget-auth.outcome }}"
          post_status "nuget-push-${{ steps.nuget-push.outputs.auth_source }}" "${{ steps.nuget-push.outcome }}"
          if [ "${{ steps.nuget-push.outcome }}" != "success" ]; then
            post_status "nuget-error-${{ steps.nuget-push.outputs.error_slug }}" "failure"
          fi
          post_status "github-packages" "${{ steps.github-packages.outcome }}"

          if [ "${{ steps.release-asset.outcome }}" = "success" ]; then
            overall="success"
          else
            overall="failure"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$overall" \
            -f context="release/${{ steps.release.outputs.tag }}" \
            -f description="GitHub release complete; registry publishing reported separately"
