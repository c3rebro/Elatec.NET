name: Publish NuGet Package

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  publish:
    if: github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      statuses: write
      id-token: write  # required for OIDC trusted publishing to NuGet.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          version=$(grep -oPm1 '(?<=<AssemblyVersion>)[^<]+' Elatec.NET.csproj)
          if [ -z "$version" ]; then
            echo "Could not determine AssemblyVersion from Elatec.NET.csproj" >&2
            exit 1
          fi

          expected_tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "$tag" != "$expected_tag" ]; then
              echo "Tag $tag does not match project version $expected_tag" >&2
              exit 1
            fi
          else
            tag="$expected_tag"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        id: restore
        run: dotnet restore Elatec.NET.sln

      - name: Test
        id: test
        run: dotnet test Elatec.NET.sln --no-restore

      - name: Pack
        id: pack
        run: dotnet pack Elatec.NET.csproj --configuration Release --output ./nupkg

      - name: Create release tag
        id: tag
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          existing=$(git ls-remote --tags origin "refs/tags/${tag}" | cut -f1)

          if [ -n "$existing" ]; then
            echo "Tag $tag already exists at $existing; leaving it unchanged."
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi

      - name: Create GitHub release
        id: github-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" --title "Elatec.NET $tag" --generate-notes
          fi

      - name: Get NuGet.org token via Trusted Publishing (OIDC)
        id: nuget-auth
        shell: bash
        run: |
          oidc_token=$(curl -sS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nuget.org" | jq -r .value)
          nuget_token=$(curl -sS -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            "https://api.nuget.org/v1/trustedpublisher/exchange" | jq -r .token)

          if [ -z "$nuget_token" ] || [ "$nuget_token" = "null" ]; then
            echo "NuGet.org trusted-publishing token exchange failed." >&2
            exit 1
          fi

          echo "::add-mask::${nuget_token}"
          echo "token=${nuget_token}" >> "$GITHUB_OUTPUT"

      - name: Push to NuGet.org
        id: nuget-push
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.nuget-auth.outputs.token }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push to GitHub Packages
        id: github-packages
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/c3rebro/index.json --skip-duplicate

      - name: Record release status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          state="${{ job.status }}"
          if [ "$state" = "success" ]; then
            api_state="success"
          else
            api_state="failure"
          fi

          description="test=${{ steps.test.outcome }}, pack=${{ steps.pack.outcome }}, tag=${{ steps.tag.outcome }}, release=${{ steps.github-release.outcome }}, nuget=${{ steps.nuget-push.outcome }}, ghpkg=${{ steps.github-packages.outcome }}"
          description=$(printf '%s' "$description" | cut -c1-140)

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$api_state" \
            -f context="release/${{ steps.release.outputs.tag }}" \
            -f description="$description"
